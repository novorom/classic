<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#1a1a2e"/>
  
  <!-- Decorative circle -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#e94560" stroke-width="3" opacity="0.3"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.2"/>
  
  <!-- Book icon -->
  <g transform="translate(400, 320)">
    <!-- Left page -->
    <path d="M-120 -80 L-100 80 L-10 80 L-30 -80 Z" fill="#2d2d44" stroke="#e94560" stroke-width="2"/>
    <!-- Right page -->
    <path d="M120 -80 L100 80 L10 80 L30 -80 Z" fill="#2d2d44" stroke="#e94560" stroke-width="2"/>
    <!-- Book spine -->
    <rect x="-5" y="-80" width="10" height="160" fill="#e94560"/>
    <!-- Book lines -->
    <line x1="-90" y1="-50" x2="-40" y2="-50" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="-90" y1="-20" x2="-40" y2="-20" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="-90" y1="10" x2="-40" y2="10" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="-90" y1="40" x2="-40" y2="40" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="-50" x2="90" y2="-50" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="-20" x2="90" y2="-20" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="10" x2="90" y2="10" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="40" x2="90" y2="40" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Main text -->
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#ffffff">
    Clásicos
  </text>
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#ffffff">
    en Corto
  </text>
  
  <!-- Tagline -->
  <text x="400" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f59e0b">
    Literatura Rusa en Español
  </text>
  
  <!-- Decorative elements -->
  <text x="400" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#e94560" opacity="0.8">
    📚
  </text>
</svg>
