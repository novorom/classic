<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent) -->
  
  <!-- Book icon -->
  <g transform="translate(75, 60)">
    <!-- Left page -->
    <path d="M-25 -20 L-20 25 L-5 25 L-10 -20 Z" fill="#2d2d44" stroke="#e94560" stroke-width="1"/>
    <!-- Right page -->
    <path d="M25 -20 L20 25 L5 25 L10 -20 Z" fill="#2d2d44" stroke="#e94560" stroke-width="1"/>
    <!-- Book spine -->
    <rect x="-2" y="-20" width="4" height="45" fill="#e94560"/>
    <!-- Book lines -->
    <line x1="-18" y1="-12" x2="-8" y2="-12" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="-18" y1="-4" x2="-8" y2="-4" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="-18" y1="4" x2="-8" y2="4" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="-18" y1="12" x2="-8" y2="12" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="8" y1="-12" x2="18" y2="-12" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="8" y1="-4" x2="18" y2="-4" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="8" y1="4" x2="18" y2="4" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <line x1="8" y1="12" x2="18" y2="12" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="75" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#ffffff">
    Clásicos
  </text>
  <text x="75" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#ffffff">
    en Corto
  </text>
  
  <!-- Subtle border -->
  <rect x="5" y="5" width="140" height="140" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" rx="10"/>
</svg>
