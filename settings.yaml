project:
  name: "Russian Classics Engine"
  language: "Spanish"
  timezone: "Europe/Madrid"

paths:
  assets: "assets"
  cache: "cache"
  output: "output"
  logs: "logs"
  music: "assets/music"
  fonts: "assets/fonts"

providers:
  story: "gemini"
  image: "pollinations"
  tts: "gtts"

gemini:
  model: "gemini-2.5-flash"
  api_key_envs:
    - "GEMINI_API_KEYS"
    - "GEMINI_API_KEY_1"
    - "GEMINI_API_KEY_2"
    - "GEMINI_API_KEY_3"
    - "GEMINI_API_KEY"
  temperature: 0.9
  max_retries: 3

pollinations:
  base_url: "https://image.pollinations.ai/prompt"
  model: "flux"
  width: 1080
  height: 1920
  enhance: true
  safe: false
  nologo: true
  timeout_seconds: 90
  max_retries: 3

video:
  width: 1080
  height: 1920
  fps: 30
  horizontal_stretch: 1.0
  codec: "libx264"
  audio_codec: "aac"
  preset: "medium"
  crf: 20
  scene_duration_seconds: 5.5
  fallback_duration_seconds: 4.8
  min_total_seconds: 40
  max_total_seconds: 58

story:
  scene_count: 8
  min_words_per_scene: 5
