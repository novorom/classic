name: Daily Russian Classics Reel

on:
  schedule:
    # Run once a day at 6 PM UTC (8 PM GMT+2)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional literary work/topic to generate (leave empty for random)'
        required: false
        default: ''
      privacy:
        description: 'YouTube privacy status for this run'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python main.py

      - name: Persist topic rotation state
        if: github.event.inputs.topic == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/rotation.json
          git commit -m "chore: advance topic rotation [skip ci]" || echo "No rotation change to commit"
          git push || echo "Nothing to push"

      - name: Upload generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: russian-classics-reel
          path: |
            output/video.mp4
            output/thumbnail.jpg
            output/subtitles.srt
            output/youtube.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload to YouTube
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          # Read metadata from generated files
          TITLE=$(head -1 output/youtube.txt)
          DESCRIPTION=$(tail -n +2 output/youtube.txt)

          python youtube_uploader.py \
            output/video.mp4 \
            "$TITLE" \
            "$DESCRIPTION"

      - name: Send video to Telegram for manual posting
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CLASSIC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram_notifier.js
