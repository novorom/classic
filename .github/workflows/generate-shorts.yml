name: Generar Videos Literarios Automáticos

on:
  schedule:
    # Se ejecuta dos veces al día: a las 9:00 AM y a las 6:00 PM UTC
    - cron: '0 9,18 * * *'
  workflow_dispatch:
    # Permite activar la generación del video de manera manual desde GitHub
    inputs:
      book_id:
        description: 'ID de la obra a generar (e.g. pushkin-yo-os-ame, dostoyevski-noches-blancas)'
        required: false
        default: 'pushkin-yo-os-ame'
      script_index:
        description: 'Índice del guion dentro de la obra (0 para la primera versión, 1 para la segunda)'
        required: false
        default: '0'

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Instalar Dependencias
      run: npm install

    - name: Instalar FFmpeg
      run: |
        sudo apt-get update -y
        sudo apt-get install -y ffmpeg
        ffmpeg -version

    - name: Generar Video (Español)
      run: node scripts/generate_video.js
      env:
        BOOK_ID: ${{ github.event.inputs.book_id || 'pushkin-yo-os-ame' }}
        SCRIPT_INDEX: ${{ github.event.inputs.script_index || '0' }}
        EDGE_TTS_VOICE: es-ES-AlvaroNeural

    - name: Subir Video Generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: video-clasico-literatura
        path: dist/clasicos_corto_output.mp4
        if-no-files-found: error
        retention-days: 7

    - name: Instalar Simplified CLI
      run: npm install -g simplified-cli

    - name: Publicar Video en Redes Sociales (TikTok, Reels, Shorts)
      if: success()
      run: node scripts/publish.js
      env:
        BOOK_ID: ${{ github.event.inputs.book_id || 'pushkin-yo-os-ame' }}
        SCRIPT_INDEX: ${{ github.event.inputs.script_index || '0' }}
        SIMPLIFIED_API_KEY: ${{ secrets.SIMPLIFIED_API_KEY }}
        SIMPLIFIED_ACCOUNT_IDS: ${{ secrets.SIMPLIFIED_ACCOUNT_IDS }}
        SIMPLIFIED_TIKTOK_ACCOUNT_IDS: ${{ secrets.SIMPLIFIED_TIKTOK_ACCOUNT_IDS }}
        SIMPLIFIED_INSTAGRAM_ACCOUNT_IDS: ${{ secrets.SIMPLIFIED_INSTAGRAM_ACCOUNT_IDS }}
        SIMPLIFIED_YOUTUBE_ACCOUNT_IDS: ${{ secrets.SIMPLIFIED_YOUTUBE_ACCOUNT_IDS }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
